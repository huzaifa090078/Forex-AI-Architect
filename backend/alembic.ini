# Alembic configuration file
# https://alembic.sqlalchemy.org/en/latest/

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os

# The database URL is read from the DATABASE_URL environment variable at runtime.
# Do NOT hardcode credentials here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
